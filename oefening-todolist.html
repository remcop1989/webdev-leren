<!-- Een lijst (tabel of <ul>, jouw keuze) met een paar taken, elk met:
1) een knop "Klaar" die de taak doorstreept (CSS-class toggle) én de knoptekst laat wisselen tussen "Klaar" 
en "Heropen" — dit ken je al uit oefening 1/2.
2) een knop "Verwijder" die eerst een bevestigingsvraag toont met de naam van de taak, en pas bij "ja" de 
rij echt verwijdert — dit ken je uit oefening 4 (closures, confirm(), .closest(), .remove()).
Eén listener per functionaliteit via event delegation op het gezamenlijke ouderelement (niet per knop) 
— dus je moet in je click-handler onderscheiden of er op "Klaar" of op "Verwijder" geklikt is.
3) Onderaan een regel tekst: "X van de Y taken nog open", die na élke wijziging (afvinken, heropenen, 
verwijderen) automatisch klopt. -->

<!-- =================================================================================================== -->

<!DOCTYPE html>
<html>
    <head>
        <style>
            html {
                background-color: lightyellow;
                display: flex;
                justify-content: center;
            }
            .tabelKop {
                font-weight: bold;
            }

            .klaar {
                text-decoration: line-through;
            }
            
            .kader {
                display: flex;
                justify-content: center;
                width: 350px;
                background-color: mediumaquamarine;
            }

            .secondColumn {
                width: 70px;
            }

        </style>
    </head>
    <body>
        
        <h1>Things to do</h1>
        <p class="aantalTaken"></p>
        
        <div class="kader">
            <table class="taakTabel">
                <tr>
                    <td class="tabelKop">Omschrijving</td>
                    <td class="secondColumn"></td>
                    <td></td>
                </tr>
                <tr>
                    <td class=" taak taak1">Boodschappen doen</td>
                    <td class="secondColumn"><button class="klaarKnop" data-target=".taak1" data-taak-klaar="Heropen" data-taak-open="Klaar">Klaar</button></td>
                    <td><button class="verwijderKnop" data-target=".taak1">Verwijder</button></td>
                </tr>
                <tr>
                    <td class="taak taak2">Auto tanken</td>
                    <td class="secondColumn"><button class="klaarKnop" data-target=".taak2" data-taak-klaar="Heropen" data-taak-open="Klaar">Klaar</button></td>
                    <td><button class="verwijderKnop" data-target=".taak2">Verwijder</button></td>
                </tr>
                <tr>
                    <td class="taak taak3">Administratie bijwerken</td>
                    <td class="secondColumn"><button class="klaarKnop" data-target=".taak3" data-taak-klaar="Heropen" data-taak-open="Klaar">Klaar</button></td>
                    <td><button class="verwijderKnop" data-target=".taak3">Verwijder</button></td>
                </tr>
                <tr>
                    <td class="taak taak4">Ramen wassen</td>
                    <td class="secondColumn"><button class="klaarKnop" data-target=".taak4" data-taak-klaar="Heropen" data-taak-open="Klaar">Klaar</button></td>
                    <td><button class="verwijderKnop" data-target=".taak4">Verwijder</button></td>
                </tr>
            </table>

        </div>

        <script>
            
            taakTellerBijwerken();

            function taakTellerBijwerken() {
                const aantalTakenTekst = document.querySelector(".aantalTaken");
                const alleTakenAantal = document.querySelectorAll(".taak").length;
                const afgerondeTakenAantal = document.querySelectorAll(".klaar").length;
                const openTakenAantal = alleTakenAantal - afgerondeTakenAantal;
                aantalTakenTekst.textContent = "Er zijn nog " + openTakenAantal + " van de " + alleTakenAantal + " taken open";
            }

            const tabelMetTaken = document.querySelector(".taakTabel");

            tabelMetTaken.addEventListener("click", function(event) {
                const taakOmschrijving = document.querySelector(event.target.dataset.target); //zoekt de data-target waarde van het element waar op geklikt wordt en zoekt dan de bijbehorende taak erbij door het eerste element te selecteren waarvan de classname overeenkomt met de dataset    
                const geklikteKnopClasslist = event.target.classList;
                const teVerwijderenRij = event.target.closest("tr");
                if (geklikteKnopClasslist.contains("klaarKnop")) {
                    taakAfhandelen(taakOmschrijving);
                };
                if (geklikteKnopClasslist.contains("verwijderKnop")) {
                    taakVerwijderen(teVerwijderenRij, taakOmschrijving);
                }
            })

            function taakAfhandelen(voltooideTaak) {
                if(voltooideTaak.classList.toggle("klaar")) {
                    event.target.textContent = event.target.dataset.taakKlaar;
                } else {
                    event.target.textContent = event.target.dataset.taakOpen;
                }
                taakTellerBijwerken()
            }

            function taakVerwijderen(verwijderRij, taak) {
                if(confirm("Taak " + "'" + taak.textContent + "'"+ " verwijderen?")) {
                    verwijderRij.remove();
                    taakTellerBijwerken();
                }
            }
        </script>
    </body>
</html>
