<!DOCTYPE html>
<!-- een "toon/verberg"-knop — het patroon achter FAQ-accordions, "lees meer"-links, 
dropdown-menu's. Klein genoeg om in één keer te overzien, maar je raakt meteen 
de drie basisonderdelen van JS-in-de-browser aan: een element selecteren, luisteren 
naar een klik, en iets aan die pagina veranderen. -->

<!-- --------------------------------------------------------------------------------->

<!-- Voordat je JS erbij pakt: hoe zou je met CSS alleen die tekst kunnen verbergen? 
Denk aan een property die je al kent — dat is namelijk het ding dat JS straks aan 
en uit gaat zetten. -->

<html>
    <head>
        <style>
            body {
                padding: 10px;
            }

            .tekstVak {
                border: 1px solid black;
                margin-bottom: 5px;
            }

            p {
                padding: 10px;
            }

            .tekstVerborgen {
                visibility: hidden;
            }

            details {
                margin-bottom: 20px;
            }

        </style>
    </head>
    <body>

        <!-- Met alleen HTML-->
        <details>
            <summary>Klik hier</summary>
            Dit is een stuk oefentekst om de oefening in te vullen.
        </details>

        <!-- Met Javascript en CSS erbij-->
         <div class="tekstVak">
            <p class="tekstVerborgen oefenTekst">Als je deze tekst ziet werkt de knop en code.</p>
         </div>
        <button class="button1">Toon tekst</button>

        <div class="tekstVak">
            <p class="tekstVerborgen oefenTekst2">Als je deze tekst ziet werkt de 2e knop en code ook 
            en is de knop herbruikbaar</p>
         </div>
        <button class="button2">Toon tekst</button>

<script>

    const button1Toggle = document.querySelector(".button1");
    const button2Toggle = document.querySelector(".button2");

    // Test hoe ik bij de knop tekst kom:
    // console.log(buttonResult.innerHTML);

/*     denk eraan om een andere class te gebruiken om de tekst te selecteren en niet dezelfde class
    Bij gebruik van dezelfde class verwijderd hij na 1 klik namelijk die class en vindt hij hem
    bij de 2e klik niet meer */
    
    button1Toggle.addEventListener("click", function() {
        const tekstVakInhoud = document.querySelector(".oefenTekst");
        const isTekstVerborgen = tekstVakInhoud.classList.toggle("tekstVerborgen");
        const classNaam = button1Toggle; //classNaam = button1Toggle.className werkt hier niet want dat geeft een string
        knopTekstWijzigen(isTekstVerborgen, classNaam);
    });

    button2Toggle.addEventListener("click", function() {
        const tekstVakInhoud = document.querySelector(".oefenTekst2");
        const isTekstVerborgen = tekstVakInhoud.classList.toggle("tekstVerborgen");
        const classNaam = button2Toggle; //classNaam = button2Toggle.className werkt hier niet want dat geeft een string
        knopTekstWijzigen(isTekstVerborgen, classNaam);
    });

    function knopTekstWijzigen(isTekstVerborgen, classNaam) {
        if (isTekstVerborgen === true) {                //=== true kan hier vervallen. Enkel isTekstVerborgen geeft al een boolean "true"
            classNaam.textContent = "Toon tekst";
        } else {
            classNaam.textContent = "Verberg tekst";
        }
        //dit if-statement kan ook korter (ternary operator) via:
        //buttonResult.textContent = isTekstVerborgen ? "Toon tekst" : "Verberg tekst";
    }

</script>

    </body>
</html>
