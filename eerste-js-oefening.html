//Nog verder vereenvoudigd met een forEach

const alleKnoppen = document.querySelectorAll(".verbergenKnop");

alleKnoppen.forEach(function(knop) {
    knop.addEventListener("click", function(event) {
        const teVerbergenTekst = document.querySelector(event.currentTarget.dataset.target);
        teVerbergenTekst.classList.toggle("tekstVerborgen"); //bij classlist geen "." voor een class
    });
});

</script>
